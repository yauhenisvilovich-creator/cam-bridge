<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Камера</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; color: #fff; font-family: -apple-system, sans-serif;
      overflow: hidden; position: fixed; inset: 0;
    }
    video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }
    /* Верхняя плашка выбора объектива (если телефон открыл ширик без фокуса) */
    .top-bar {
      position: fixed; top: 12px; left: 12px; right: 12px;
      z-index: 100; display: flex; justify-content: space-between; align-items: center;
      gap: 8px; pointer-events: auto;
    }
    .cam-select {
      background: rgba(0,0,0,0.65); color: #fff; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 18px; padding: 8px 12px; font-size: 12px; flex: 1; outline: none;
    }
    .btn-torch {
      background: rgba(0,0,0,0.65); color: #fff; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 18px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    /* Фиксированная панель кнопок внизу экрана */
    .controls {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 12px));
      display: flex; justify-content: space-around; align-items: center; gap: 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85) 35%);
      z-index: 100;
    }
    .btn {
      padding: 15px 22px; border-radius: 28px; border: none;
      font-size: 14px; font-weight: 700; text-transform: uppercase;
      cursor: pointer; flex: 1; text-align: center;
    }
    .btn-snap { background: #c81d32; color: #fff; box-shadow: 0 4px 16px rgba(200,29,50,0.5); flex: 1.4; }
    .btn-snap:disabled { opacity: 0.6; }
    .btn-close { background: rgba(255,255,255,0.2); color: #fff; backdrop-filter: blur(4px); }
    /* Кольцо фокусировки при нажатии на экран */
    .focus-ring {
      position: fixed; width: 64px; height: 64px;
      border: 2px solid #ffeb3b; border-radius: 50%;
      transform: translate(-50%, -50%) scale(1.3);
      pointer-events: none; z-index: 50; opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .focus-ring.active { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    .hint {
      position: fixed; bottom: 96px; left: 0; right: 0;
      text-align: center; font-size: 11px; color: rgba(255,255,255,0.75);
      z-index: 90; pointer-events: none; text-shadow: 0 1px 3px #000;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <select id="camSelect" class="cam-select" onchange="switchCamera(this.value)">
      <option value="">Основная камера (Автофокус)</option>
    </select>
    <button id="torchBtn" class="btn-torch" onclick="toggleTorch()" style="display:none;">🔦 Свет</button>
  </div>

  <video id="v" autoplay playsinline muted onclick="triggerTapFocus(event)"></video>
  <div id="focusRing" class="focus-ring"></div>
  <div id="statusHint" class="hint">Нажмите на экран для фокусировки</div>

  <div class="controls">
    <button type="button" class="btn btn-close" onclick="closeCameraWindow()">Отмена</button>
    <button type="button" id="snapBtn" class="btn btn-snap" onclick="snap()">📸 Снять фото</button>
  </div>

  <script>
    var video = document.getElementById('v');
    var currentStream = null;
    var currentTrack = null;
    var torchOn = false;
    var urlParams = new URLSearchParams(window.location.search);
    var sessionKey = urlParams.get('sid') || '';
    var gasUrl = urlParams.get('gas') || '';

    function stopStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(function(t) { t.stop(); });
        currentStream = null;
        currentTrack = null;
      }
    }

    // Включение непрерывного автофокуса на дорожке камеры
    function applyContinuousAutofocus(track) {
      if (!track || !track.getCapabilities || !track.applyConstraints) return;
      try {
        var caps = track.getCapabilities();
        var adv = {};
        if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
          adv.focusMode = 'continuous';
        }
        if (caps.exposureMode && caps.exposureMode.indexOf('continuous') !== -1) {
          adv.exposureMode = 'continuous';
        }
        if (caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf('continuous') !== -1) {
          adv.whiteBalanceMode = 'continuous';
        }
        if (Object.keys(adv).length > 0) {
          track.applyConstraints({ advanced: [adv] }).catch(function(){});
        }
        // Показываем кнопку фонарика, если поддерживается
        var torchBtn = document.getElementById('torchBtn');
        if (caps.torch && torchBtn) {
          torchBtn.style.display = 'block';
        } else if (torchBtn) {
          torchBtn.style.display = 'none';
        }
      } catch (e) {}
    }

    // Перезапуск фокуса по тапу на экран
    function triggerTapFocus(e) {
      var ring = document.getElementById('focusRing');
      if (ring) {
        ring.style.left = e.clientX + 'px';
        ring.style.top = e.clientY + 'px';
        ring.classList.add('active');
        setTimeout(function() { ring.classList.remove('active'); }, 600);
      }
      if (!currentTrack || !currentTrack.getCapabilities || !currentTrack.applyConstraints) return;
      try {
        var caps = currentTrack.getCapabilities();
        if (caps.focusMode) {
          var mode = caps.focusMode.indexOf('single-shot') !== -1 ? 'single-shot' : 'continuous';
          currentTrack.applyConstraints({ advanced: [{ focusMode: mode }] }).then(function() {
            if (caps.focusMode.indexOf('continuous') !== -1) {
              setTimeout(function() {
                currentTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function(){});
              }, 700);
            }
          }).catch(function(){});
        }
      } catch (err) {}
    }

    function toggleTorch() {
      if (!currentTrack) return;
      torchOn = !torchOn;
      try {
        currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function(){});
      } catch (e) {}
    }

    // Загрузка списка задних камер (чтобы на Samsung выбирать 1x основную камеру с автофокусом, а не 0.6x ширик)
    function loadBackCamerasList(activeDeviceId) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      navigator.mediaDevices.enumerateDevices().then(function(devices) {
        var videoInputs = devices.filter(function(d) { return d.kind === 'videoinput'; });
        var backCams = videoInputs.filter(function(d) {
          var l = (d.label || '').toLowerCase();
          return l.indexOf('back') !== -1 || l.indexOf('rear') !== -1 || l.indexOf('environment') !== -1 || l.indexOf('задн') !== -1 || l.indexOf('0') !== -1;
        });
        var listToUse = backCams.length > 0 ? backCams : videoInputs;
        var sel = document.getElementById('camSelect');
        if (!sel || listToUse.length <= 1) return;

        sel.innerHTML = '';
        listToUse.forEach(function(cam, idx) {
          var opt = document.createElement('option');
          opt.value = cam.deviceId;
          opt.textContent = cam.label || ('Камера #' + (idx + 1));
          if (cam.deviceId === activeDeviceId) opt.selected = true;
          sel.appendChild(opt);
        });
      }).catch(function(){});
    }

    function startCamera(deviceId) {
      stopStream();
      var videoConstraints = {
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        focusMode: { ideal: 'continuous' }
      };
      if (deviceId) {
        videoConstraints.deviceId = { exact: deviceId };
      } else {
        videoConstraints.facingMode = { ideal: 'environment' };
      }

      navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false })
        .then(function(stream) {
          currentStream = stream;
          video.srcObject = stream;
          var tracks = stream.getVideoTracks();
          if (tracks && tracks.length > 0) {
            currentTrack = tracks[0];
            applyContinuousAutofocus(currentTrack);
            var settings = currentTrack.getSettings ? currentTrack.getSettings() : {};
            loadBackCamerasList(settings.deviceId || deviceId);

            // Если Samsung по умолчанию выбрал широкоугольную камеру без автофокуса, автоматически переключаем на основную заднюю камеру (обычно последняя или первая с continuous focus)
            if (!deviceId && currentTrack.getCapabilities) {
              var caps = currentTrack.getCapabilities();
              if (!caps.focusMode || caps.focusMode.indexOf('continuous') === -1) {
                autoPickFocusableBackCamera();
              }
            }
          }
        })
        .catch(function(err) {
          alert('Ошибка доступа к камере: ' + err.message);
        });
    }

    var triedAutoSwitch = false;
    function autoPickFocusableBackCamera() {
      if (triedAutoSwitch || !navigator.mediaDevices.enumerateDevices) return;
      triedAutoSwitch = true;
      navigator.mediaDevices.enumerateDevices().then(function(devices) {
        var backCams = devices.filter(function(d) {
          var l = (d.label || '').toLowerCase();
          return d.kind === 'videoinput' && (l.indexOf('back') !== -1 || l.indexOf('rear') !== -1 || l.indexOf('environment') !== -1);
        });
        // На Samsung основная 1x камера с автофокусом обычно идет под индексом 0 ("camera2 0, facing back")
        var mainCam = backCams.find(function(d) { return d.label.indexOf(' 0,') !== -1 || d.label.indexOf('0') !== -1; }) || backCams[0];
        if (mainCam && mainCam.deviceId) {
          startCamera(mainCam.deviceId);
        }
      }).catch(function(){});
    }

    function switchCamera(deviceId) {
      if (deviceId) startCamera(deviceId);
    }

    function closeCameraWindow() {
      stopStream();
      window.close();
    }

    function snap() {
      if (!video.videoWidth) return;
      var btn = document.getElementById('snapBtn');
      var hint = document.getElementById('statusHint');
      btn.disabled = true;
      btn.textContent = 'Сохранение...';
      if (hint) hint.textContent = 'Передача снимка в накладную...';

      var canvas = document.createElement('canvas');
      var MAX = 1600, w = video.videoWidth, h = video.videoHeight;
      if (w > h && w > MAX) { h = Math.round(h * (MAX / w)); w = MAX; }
      else if (h >= w && h > MAX) { w = Math.round(w * (MAX / h)); h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.85);

      stopStream();

      // 1. Отправляем напрямую через window.opener (если браузер сохранил связь)
      var sentViaOpener = false;
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'DIRECT_CAMERA_PHOTO', base64: dataUrl, sid: sessionKey }, '*');
          sentViaOpener = true;
        }
      } catch (e) {}

      // 2. Одновременно отправляем через POST в Google Apps Script (чтобы в Telegram WebApp на Android фото прикрепилось даже если window.opener закрыт)
      if (gasUrl && sessionKey) {
        fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            custom_action: 'camera_bridge_upload',
            sid: sessionKey,
            base64: dataUrl.split(',')[1]
          })
        }).then(function() {
          window.close();
        }).catch(function() {
          window.close();
        });
        setTimeout(function() { window.close(); }, 1200);
      } else {
        window.close();
      }
    }

    startCamera();
  </script>
</body>
</html>
